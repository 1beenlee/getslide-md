name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Node and browser versions
        run: |
          node --version
          google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version

      - name: Syntax check tools
        run: |
          node --check tools/prepare-deck.mjs
          node --check tools/test-agent-workflow.mjs
          node --check tools/evaluate-edit.mjs
          node --check tools/test-editability-eval.mjs
          node --check tools/browser-qa.mjs

      - name: Test editability evaluator
        run: node tools/test-editability-eval.mjs

      - name: Run real browser QA
        run: node tools/browser-qa.mjs examples/hackathon-demo/index.html

      - name: Test agent-native workflow
        run: node tools/test-agent-workflow.mjs

      - name: Test existing generation harness
        run: node tools/test-generation-harness.mjs

      - name: Validate public example deck
        run: node tools/validate-deck.mjs examples/hackathon-demo/index.html
